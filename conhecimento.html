<script>
const temas = {
  estado: ['Política', 'O que é Estado?', 'Instituições, leis e serviços organizam a vida coletiva.', ['O Estado reúne instituições que exercem autoridade em um território e sobre uma população. Ele cria regras, administra recursos e oferece serviços públicos.', 'Em uma democracia, o Estado não pertence a um governo ou partido. Ele deve funcionar dentro da Constituição, respeitar direitos e prestar contas à sociedade.', 'Entender essa diferença ajuda a separar o que é público do que é interesse particular e a cobrar que as instituições atendam toda a população.']],
  democracia: ['Política', 'Democracia e cidadania', 'Participação, direitos e controle do poder.', ['Democracia é um modo de organizar o poder com participação popular, eleições, direitos e regras comuns. Ela também exige liberdade de expressão e instituições capazes de fiscalizar autoridades.', 'Cidadania não se resume a votar. Inclui acompanhar políticas, participar de espaços coletivos, cobrar respostas e defender direitos.', 'Quanto mais informada e ativa é a sociedade, maior é a chance de que as decisões públicas reflitam necessidades reais.']],
  inflacao: ['Economia', 'Inflação e custo de vida', 'Por que os preços sobem e o poder de compra muda.', ['Inflação é o aumento geral dos preços de bens e serviços ao longo do tempo. Ela não significa que apenas um produto ficou mais caro, mas que o conjunto de gastos está pressionando a renda.', 'Quando a renda cresce menos que os preços, as famílias conseguem comprar menos. Por isso, inflação afeta especialmente quem tem orçamento apertado.', 'Acompanhar índices, comparar períodos e observar diferentes cestas de consumo ajuda a compreender como o custo de vida muda.']],
  orcamento: ['Economia', 'Impostos e orçamento público', 'Como a arrecadação vira política pública.', ['Impostos são contribuições usadas para financiar serviços e políticas públicas. Eles podem incidir sobre renda, consumo, patrimônio e circulação de bens.', 'O orçamento público organiza a previsão de receitas e despesas. Ele mostra prioridades, define limites e permite acompanhar se o planejamento está sendo executado.', 'Conhecer o orçamento ajuda a transformar reclamações gerais em perguntas concretas: quanto será investido, em qual região, em que prazo e com qual resultado esperado.']],
  poderes: ['Política', 'Os três poderes', 'Separação e equilíbrio para evitar a concentração de poder.', ['O Executivo administra políticas e serviços; o Legislativo cria leis, aprova o orçamento e fiscaliza; o Judiciário interpreta as leis e resolve conflitos.', 'A separação de poderes cria controles recíprocos. Nenhum órgão deveria concentrar sozinho a capacidade de fazer, executar e julgar todas as decisões.', 'Conhecer essas funções ajuda a identificar quem é responsável por cada problema e a fazer cobranças ao órgão correto.']],
  desigualdade: ['Economia', 'Trabalho e desigualdade', 'Como renda e oportunidades são distribuídas.', ['Desigualdade aparece quando pessoas e grupos têm acesso muito diferente a renda, educação, saúde, moradia, tempo e oportunidades de trabalho.', 'O mercado de trabalho influencia essa distribuição, mas políticas públicas também fazem diferença. Educação, proteção social, serviços universais e direitos trabalhistas podem reduzir desvantagens.', 'Estudar desigualdade é observar não apenas quanto cada pessoa recebe, mas também quais condições permitem ou impedem uma vida digna.']]
};
